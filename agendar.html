<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar | JK Barbearia</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="css/style.css"></head><body>
<header class="header"><div class="container nav"><a class="brand" href="index.html"><img src="assets/logo.svg" alt=""></a><nav class="navlinks" style="display:flex;position:static;background:none;border:0"><a href="index.html">← Voltar</a></nav></div></header>
<main class="container"><div class="form-shell"><aside class="form-card sticky"><span class="eyebrow">Agendamento online</span><h1 style="font-size:2.7rem;line-height:1">Reserve seu horário.</h1><p class="subtitle">Escolha o barbeiro e veja somente os horários disponíveis daquele profissional.</p><div class="notice"><strong>Resumo</strong><br>Barbeiro: <span id="summaryBarber">—</span><br>Serviço: <span id="summaryService">—</span><br>Valor: <span id="summaryPrice">—</span><br>Data: <span id="summaryDate">—</span><br>Horário: <span id="summaryTime">—</span></div><div id="successBox" class="notice" style="display:none;margin-top:14px;border-color:rgba(84,182,122,.35)">✓ Agendamento confirmado.<br>Protocolo: <strong id="protocol"></strong></div></aside>
<section class="form-card"><form id="bookingForm" class="form-grid"><div class="field"><label>Seu nome</label><input name="name" required maxlength="80"></div><div class="field"><label>WhatsApp</label><input name="phone" required maxlength="25"></div><div class="field full"><label>Serviço</label><select id="service" name="service" required><option>Carregando...</option></select></div><div class="field full"><label>Barbeiro</label><select id="barber" name="barber" required><option>Carregando...</option></select></div><div class="field full"><label>Data</label><input id="date" name="date" type="date" required></div><div class="field full"><label>Horários disponíveis</label><div id="times" class="time-grid"><div class="empty" style="grid-column:1/-1">Escolha serviço, barbeiro e data.</div></div></div><div class="field full"><label>Observação</label><textarea name="notes" rows="4" maxlength="250"></textarea></div><div class="field full"><button class="btn btn-primary" type="submit">Confirmar agendamento</button></div></form></section></div></main>
<div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/booking.js"></script></body></html>
