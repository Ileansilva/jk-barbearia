<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | JK Barbearia</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css"></head><body class="admin-body">
<div id="loginOverlay" class="login-overlay"><form id="loginForm" class="login-card"><img src="assets/logo.svg"><h1>Área do proprietário</h1><p>Login protegido pelo Supabase Auth.</p><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field" style="margin-top:12px"><label>Senha</label><input name="password" type="password" required></div><div id="loginError" style="color:#ff9c9c;margin-top:9px"></div><button class="btn btn-primary">Entrar</button></form></div>
<div class="admin-wrap"><aside class="sidebar"><a href="index.html"><img src="assets/logo.svg"></a><nav class="side-nav"><button class="active" data-panel="dashboard">Visão geral</button><button data-panel="appointments">Agendamentos</button><button data-panel="services">Serviços</button><button data-panel="settings">Configurações</button></nav></aside><main class="admin-main"><div class="admin-top"><div><span class="eyebrow">Painel administrativo</span><h1>JK Barbearia</h1></div><div class="action-row"><a class="btn btn-outline" href="index.html">Ver site</a><button id="logout" class="btn btn-outline">Sair</button></div></div>
<section id="dashboard" class="panel active"><div class="kpis"><div class="kpi"><span>Hoje</span><strong id="kpiToday">0</strong></div><div class="kpi"><span>Este mês</span><strong id="kpiMonth">0</strong></div><div class="kpi"><span>Faturamento do mês*</span><strong id="kpiRevenue">R$ 0</strong></div><div class="kpi"><span>Serviços ativos</span><strong id="kpiServices">0</strong></div></div><div class="card"><p class="muted">*Estimativa com agendamentos não cancelados.</p></div></section>
<section id="appointments" class="panel"><div class="card"><div class="card-head"><h2>Agendamentos</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Serviço</th><th>Data</th><th>Valor</th><th>Status</th><th>Obs.</th><th>Ações</th></tr></thead><tbody id="bookingRows"></tbody></table></div></div></section>
<section id="services" class="panel"><div class="card"><div class="card-head"><h2>Adicionar / editar serviço</h2></div><form id="serviceForm" class="form-grid"><input id="serviceId" name="id" type="hidden"><div class="field"><label>Nome</label><input id="serviceName" name="name" required></div><div class="field"><label>Preço</label><input id="servicePrice" name="price" type="number" min="0" step=".01" required></div><div class="field"><label>Duração (min)</label><input id="serviceDuration" name="duration" type="number" min="10" step="5" required></div><div class="field"><label>Ordem</label><input id="serviceSort" name="sort_order" type="number" value="0"></div><div class="field full"><label>Descrição</label><textarea id="serviceDescription" name="description"></textarea></div><div class="field full"><label>URL da imagem (opcional)</label><input id="serviceImage" name="image_url"></div><div class="field full"><label>Ou envie uma imagem</label><input name="image_file" type="file" accept="image/*"></div><div class="field full"><button class="btn btn-primary">Salvar serviço</button></div></form></div><div id="serviceAdminGrid" class="service-admin-grid"></div></section>
<section id="settings" class="panel"><div class="card"><form id="settingsForm" class="form-grid"><div class="field"><label>Nome da empresa</label><input id="businessName" name="businessName"></div><div class="field"><label>WhatsApp</label><input id="phone" name="phone"></div><div class="field"><label>Instagram</label><input id="instagram" name="instagram"></div><div class="field"><label>Endereço</label><input id="address" name="address"></div><div class="field"><label>Abertura</label><input id="openTime" name="openTime" type="time"></div><div class="field"><label>Fechamento</label><input id="closeTime" name="closeTime" type="time"></div><div class="field"><label>Intervalo (min)</label><input id="interval" name="interval" type="number" min="15"></div><div class="field full"><label>Dias de trabalho (0=dom ... 6=sáb)</label><input id="workDays" name="workDays"></div><div class="field full"><label>Datas bloqueadas (AAAA-MM-DD, separadas por vírgula)</label><input id="blockedDates" name="blockedDates"></div><div class="field full"><button class="btn btn-primary">Salvar configurações</button></div></form></div></section>
</main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/admin.js"></script></body></html>
